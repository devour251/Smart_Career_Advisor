    <text x="355" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#475569">Logistic mark feasibility +</text><text x="355" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#475569">NEP-2020 cross-stream bridge</text>
  
    
    <rect x="250" y="290" width="210" height="75" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.8"/>
