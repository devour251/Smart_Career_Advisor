    <text x="612.5" y="332" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#475569">Selects optimal w*=[w_sbert,</text><text x="612.5" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#475569">w_rule, w_kg, w_riasec, w_mkt]</text>
  

    
    <rect x="765" y="165" width="220" height="125" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.8"/>
