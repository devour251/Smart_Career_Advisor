    <text x="355" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#475569">Expands HI/KN academic terms</text><text x="355" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#475569">&amp; imputes missing skills</text>
  
    
    <rect x="250" y="190" width="210" height="75" rx="8" fill="#F0FDFA" stroke="#14B8A6" stroke-width="1.8"/>
