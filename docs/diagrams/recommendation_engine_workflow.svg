    <text x="122.5" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#475569">Stage, Marks, Stream,</text><text x="122.5" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#475569">Skills, RIASEC,</text><text x="122.5" y="254" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#475569">EN/HI/KN Text</text>
  
    
