    <text x="875" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#475569">Top-N Careers + Streams</text><text x="875" y="223" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#475569">95% Confidence Interval</text><text x="875" y="239" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#475569">Side-by-Side Baseline Diff</text><text x="875" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#475569">Explainable KG Subgraph</text>
  

