    <text x="612.5" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#475569">Weighted Career-Skill-Subject</text><text x="612.5" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#475569">centrality + subgraph paths</text>
  
    
    <rect x="505" y="290" width="215" height="75" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.8"/>
