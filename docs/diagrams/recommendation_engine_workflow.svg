    <text x="612.5" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#475569">Facet attention over Skills,</text><text x="612.5" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#475569">Interests &amp; Academic vectors</text>
  
    
    <rect x="505" y="190" width="215" height="75" rx="8" fill="#F0FDFA" stroke="#14B8A6" stroke-width="1.8"/>
